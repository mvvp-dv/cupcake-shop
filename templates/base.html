<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cupcake Shop{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('home') }}">
            <span>🧁</span> Cupcake Shop
        </a>
        <nav>
            <a href="#" class="nav-link">Entrar</a>
            <button class="cart-button" type="button" id="cartButton">
                🛒 Carrinho <span id="cartCount">0</span>
            </button>
        </nav>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer>
        <strong>Cupcake Shop</strong>
        <span>Projeto acadêmico — PIT II</span>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
